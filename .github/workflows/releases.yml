name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  APP_NAME: "Kiirohana"

jobs:

# =====================================================
# BUILD REACT (TEMP ONLY / NO ARTIFACT UPLOAD)
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate output
        run: |
          test -d cordova/www || (echo "cordova/www missing" && exit 1)

      # ZIP INTERNAL TRANSFER ONLY
      - name: Pack WWW
        run: |
          cd cordova
          zip -qr ../cordova-www.zip www

      - name: Upload Internal WWW
        uses: actions/upload-artifact@v7
        with:
          name: _internal-www
          path: cordova-www.zip
          retention-days: 1

# =====================================================
# BUILD ANDROID
# =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: _internal-www

      - name: Restore WWW
        run: |
          unzip -q cordova-www.zip
          mkdir -p cordova
          rm -rf cordova/www
          mv www cordova/www

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p' cordova/config.xml | head -n1)

          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi

          echo "Detected version: $VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Reset Android platform
        working-directory: cordova
        run: |
          cordova platform rm android || true
          cordova platform add android@latest

      - name: Build Debug APK
        working-directory: cordova
        run: cordova build android

      - name: Build Release AAB
        working-directory: cordova
        run: cordova build android --release

      - name: Rename Android files
        shell: bash
        run: |
          mkdir -p release

          APK=$(find cordova/platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n1)

          AAB=$(find cordova/platforms/android/app/build/outputs/bundle -name "*.aab" | head -n1)

          echo "APK=$APK"
          echo "AAB=$AAB"

          cp "$APK" "release/Kiirohana-${{ steps.ver.outputs.version }}.apk"
          cp "$AAB" "release/Kiirohana-${{ steps.ver.outputs.version }}.aab"

          ls -lah release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: release/*.aab

# =====================================================
# BUILD ELECTRON
# =====================================================
  build-electron:
    name: Electron ${{ matrix.os }}-${{ matrix.arch }}
    needs: build-react
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64

          - os: windows
            runner: windows-latest
            arch: ia32

          - os: windows
            runner: windows-latest
            arch: arm64

          - os: linux
            runner: ubuntu-latest
            arch: x64

          - os: linux
            runner: ubuntu-latest
            arch: arm64

          - os: linux
            runner: ubuntu-latest
            arch: armv7l

          - os: macos
            runner: macos-latest
            arch: universal

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: _internal-www

      - name: Restore WWW
        shell: bash
        run: |
          unzip -q cordova-www.zip
          mkdir -p cordova
          rm -rf cordova/www
          mv www cordova/www

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools fakeroot dpkg

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Reset Electron
        working-directory: cordova
        run: |
          cordova platform rm electron || true
          cordova platform add electron

      - name: Build Electron
        working-directory: cordova
        shell: bash
        run: |
          cordova build electron -- --${{ matrix.arch }}

      - name: Remove helper junk
        shell: bash
        run: |
          find cordova -iname "elevate.exe" -delete || true
          find cordova -iname "uninstall.exe" -delete || true
          find cordova -iname "*.map" -delete || true

      - name: Upload Electron
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            cordova/**/*.exe
            !cordova/**/elevate.exe
            !cordova/**/uninstall.exe
            cordova/**/*.msi
            cordova/**/*.zip
            cordova/**/*.AppImage
            cordova/**/*.deb
            cordova/**/*.rpm
            cordova/**/*.tar.gz
            cordova/**/*.dmg
            cordova/**/*.pkg
          if-no-files-found: warn

# =====================================================
# UPLOAD TO GITHUB RELEASE
# =====================================================
  release-all:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Select final assets only
        shell: bash
        run: |
          mkdir -p release-files

          find artifacts -type f | while read -r file; do
            NAME=$(basename "$file")

          find artifacts -type f \( \
            -iname "*.apk" -o \
            -iname "*.aab" -o \
            -iname "*.exe" -o \
            -iname "*.msi" -o \
            -iname "*.zip" -o \
            -iname "*.appimage" -o \
            -iname "*.deb" -o \
            -iname "*.rpm" -o \
            -iname "*.tar.gz" -o \
            -iname "*.dmg" -o \
            -iname "*.pkg" \
          \) | while read -r file; do

                echo "COPY: $file"

                cp -f "$file" "release-files/$NAME"
                ;;
            esac
          done

          echo "=== RELEASE FILES ==="
          ls -lah release-files

          test "$(find release-files -type f | wc -l)" -gt 0

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*

# =====================================================
# TELEGRAM
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: DEV
    needs: release-all
    if: |
      success() &&
      github.event_name != 'pull_request'

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare Files
        shell: bash
        run: |
          mkdir -p telegram-files

          find artifacts -type f \( \
            -iname "*.apk" -o \
            -iname "*.aab" -o \
            -iname "*.exe" -o \
            -iname "*.msi" -o \
            -iname "*.zip" -o \
            -iname "*.appimage" -o \
            -iname "*.deb" -o \
            -iname "*.rpm" -o \
            -iname "*.tar.gz" -o \
            -iname "*.dmg" -o \
            -iname "*.pkg" \
          \) | while read -r file; do

            NAME=$(basename "$file")

            case "$NAME" in
              elevate.exe|uninstall.exe|Uninstall.exe)
                continue
                ;;
            esac

            echo "COPY: $file"

            cp "$file" telegram-files/
          done

          echo "=== TELEGRAM FILES ==="
          ls -lah telegram-files

      - name: Send Summary
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          URL="${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}"

          TEXT="🚀 ${APP_NAME} Released

          Version: $VERSION
          Repo: ${{ github.repository }}

          🔗 Release:
          $URL"

          if [ -n "$THREAD" ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              --data-urlencode text="$TEXT"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode text="$TEXT"
          fi

      - name: Send Files
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"
          MAX=$((45 * 1024 * 1024))

          find telegram-files -type f | while read -r file; do
            NAME=$(basename "$file")
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")

            [ "$SIZE" -gt "$MAX" ] && continue

            if [ -n "$THREAD" ]; then
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            else
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            fi

            sleep 2
          done