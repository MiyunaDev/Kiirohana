name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"
  JAVA_VERSION: "21"

jobs:

  # =====================================================
  # BUILD REACT
  # =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Upload WWW
        uses: actions/upload-artifact@v4
        with:
          name: cordova-www
          path: cordova/www
          if-no-files-found: error

  # =====================================================
  # BUILD ANDROID RELEASE
  # =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WWW
        uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Dependencies
        working-directory: ./cordova
        run: npm ci || npm install

      - name: Add Android Platform
        working-directory: ./cordova
        run: cordova platform add android@latest

      - name: Decode Signing Key
        working-directory: ./cordova
        run: |
          echo "${{ secrets.ANDROID_P12_BASE64 }}" | base64 -d > android-key.p12

      - name: Build Debug APK
        working-directory: ./cordova
        run: cordova build android

      - name: Build Signed Release AAB
        working-directory: ./cordova
        run: |
          cordova build android --release -- \
            --packageType=bundle \
            --keystore=android-key.p12 \
            --storeType=pkcs12 \
            --storePassword=${{ secrets.ANDROID_STORE_PASSWORD }} \
            --alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            --password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            cordova/platforms/android/app/build/outputs/apk/debug/*.apk
            cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Android To GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cordova/platforms/android/app/build/outputs/apk/debug/*.apk
            cordova/platforms/android/app/build/outputs/bundle/release/*.aab

  # =====================================================
  # BUILD ELECTRON RELEASE
  # =====================================================
  build-electron:
    name: Electron (${{ matrix.os }})
    needs: build-react
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WWW
        uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Dependencies
        working-directory: ./cordova
        run: npm ci || npm install

      - name: Add Electron Platform
        working-directory: ./cordova
        run: cordova platform add electron

      - name: Build Electron
        working-directory: ./cordova
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: cordova/platforms/electron/build/**
          if-no-files-found: warn

      - name: Upload To GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cordova/platforms/electron/build/**

  # =====================================================
  # TELEGRAM NOTIFY
  # =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine Telegram Target
        id: chat
        shell: bash
        run: |
          echo "chat_id=${{ secrets.TELEGRAM_CHAT_ID_RELEASE }}" >> "$GITHUB_OUTPUT"
          echo "mode=RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build Summary
        id: meta
        shell: bash
        run: |
          echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Send Summary Message
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ steps.chat.outputs.chat_id }}"
          MODE="${{ steps.chat.outputs.mode }}"

          TEXT=$(cat <<EOF
🚀 Release Build Finished

Mode: $MODE
Repo: ${{ steps.meta.outputs.repo }}
Branch: ${{ steps.meta.outputs.branch }}
Commit: ${{ steps.meta.outputs.sha }}
Run: ${{ steps.meta.outputs.run_url }}
EOF
)

          curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode text="$TEXT"

      - name: Send Files To Telegram
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ steps.chat.outputs.chat_id }}"

          shopt -s globstar nullglob
          COUNT=0

          for file in artifacts/**/*; do
            if [[ -f "$file" ]]; then
              NAME=$(basename "$file")
              SIZE=$(du -h "$file" | cut -f1)

              echo "Sending $NAME ($SIZE)"

              curl -s --retry 3 --retry-delay 5 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 [RELEASE] $NAME ($SIZE)"

              COUNT=$((COUNT + 1))
              sleep 2
            fi
          done

          echo "Sent $COUNT files"