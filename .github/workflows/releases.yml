name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  APP_NAME: "Kiirohana"

jobs:

# =====================================================
# BUILD REACT
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate output
        run: |
          test -d cordova/www || (echo "cordova/www missing" && exit 1)

      - name: Upload WWW
        uses: actions/upload-artifact@v4
        with:
          name: cordova-www
          path: cordova/www
          if-no-files-found: error

# =====================================================
# BUILD ANDROID
# =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install Cordova deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Reset Android platform
        working-directory: cordova
        run: |
          cordova platform rm android || true
          cordova platform add android@latest

      - name: Build APK + AAB
        working-directory: cordova
        run: |
          cordova build android
          cordova build android --release

      - name: Rename Android outputs
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          mkdir -p release-files

          find cordova -type f \( -name "*.apk" -o -name "*.aab" \) | while read f; do
            EXT="${f##*.}"
            if [ "$EXT" = "apk" ]; then
              cp "$f" "release-files/${APP_NAME} (Android) ${VERSION}.apk"
            fi
            if [ "$EXT" = "aab" ]; then
              cp "$f" "release-files/${APP_NAME} (Android Bundle) ${VERSION}.aab"
            fi
          done

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-files/*

# =====================================================
# BUILD ELECTRON MULTI OS + MULTI ARCH
# =====================================================
  build-electron:
    name: Electron ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-react

    strategy:
      fail-fast: false
      matrix:
        include:

          # Windows
          - os: windows
            runner: windows-latest
            arch: x64

          - os: windows
            runner: windows-latest
            arch: ia32

          - os: windows
            runner: windows-latest
            arch: arm64

          # Linux
          - os: linux
            runner: ubuntu-latest
            arch: x64

          - os: linux
            runner: ubuntu-latest
            arch: arm64

          - os: linux
            runner: ubuntu-latest
            arch: armv7l

          # macOS
          - os: macos
            runner: macos-latest
            arch: universal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools fakeroot dpkg

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install Cordova deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Reset Electron platform
        working-directory: cordova
        run: |
          cordova platform rm electron || true
          cordova platform add electron

      - name: Build Electron
        working-directory: cordova
        shell: bash
        run: |
          cordova build electron -- --${{ matrix.arch }}

      - name: Remove junk only
        shell: bash
        run: |
          find cordova -name "*.map" -type f -delete || true
          find cordova -name ".DS_Store" -type f -delete || true
          find cordova -name "Thumbs.db" -type f -delete || true

      - name: Rename release files
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          mkdir -p release-files

          find cordova -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o \
               -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o \
               -name "*.tar.gz" -o -name "*.dmg" -o -name "*.pkg" \) \
            | while read f; do

              BASE=$(basename "$f")
              EXT="${BASE##*.}"

              # tar.gz preserve extension
              case "$BASE" in
                *.tar.gz) EXT="tar.gz" ;;
              esac

              cp "$f" "release-files/${APP_NAME} (${{ matrix.os }}-${{ matrix.arch }}) ${VERSION}.${EXT}"
            done

      - name: Upload Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}-${{ matrix.arch }}
          path: release-files/*

  # =====================================================
  # RELEASE UPLOAD
  # =====================================================
  release-all:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # =====================================================
      # FILTER ONLY FINAL INSTALLER / PORTABLE FILES
      # =====================================================
      - name: Select release files only
        shell: bash
        run: |
          set -e
          mkdir -p release-files

          while IFS= read -r file; do
            NAME=$(basename "$file")

            case "$NAME" in
              elevate.exe|uninstall.exe|Uninstall.exe)
                echo "Skip helper: $NAME"
                ;;

              *.apk|*.aab|*.exe|*.msi|*.zip|*.AppImage|*.deb|*.rpm|*.tar.gz|*.dmg|*.pkg)
                cp -f "$file" "release-files/$NAME"
                echo "Accepted: $NAME"
                ;;

              *)
                echo "Rejected: $NAME"
                ;;
            esac

          done < <(find artifacts -type f)

          echo "Final files:"
          ls -lah release-files

      # =====================================================
      # FAIL IF NOTHING VALID
      # =====================================================
      - name: Validate release files
        shell: bash
        run: |
          COUNT=$(find release-files -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No valid release files found."
            exit 1
          fi

      # =====================================================
      # OPTIONAL: WAIT FOR GITHUB RELEASE CONSISTENCY
      # =====================================================
      - name: Stabilization delay
        run: sleep 5

      # =====================================================
      # UPLOAD SAFE FILES ONLY
      # =====================================================
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**

# =====================================================
# TELEGRAM NOTIFICATION + CHANGELOG
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: DEV
    needs: release-all
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Send Release Summary
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          URL="${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}"
          NOTES="${{ github.event.release.body }}"

          if [ -z "$NOTES" ]; then
            NOTES="No changelog provided."
          fi

          TEXT="🚀 ${APP_NAME} Released

          Version: $VERSION
          Repo: ${{ github.repository }}

          📜 Changelog:
          $NOTES

          🔗 Release:
          $URL"

          if [ -n "$THREAD" ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              --data-urlencode text="$TEXT"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode text="$TEXT"
          fi

      - name: Send Release Files
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"
          MAX=$((45 * 1024 * 1024))

          find artifacts -type f | while read file; do
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            NAME=$(basename "$file")

            if [ "$SIZE" -gt "$MAX" ]; then
              echo "Skip large file: $NAME"
              continue
            fi

            echo "Sending $NAME"

            if [ -n "$THREAD" ]; then
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            else
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            fi

            sleep 2
          done