name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - name: Install dependencies (Root / React)
        run: npm install

      - name: Build React → cordova/www
        run: npm run build

      - name: Upload Cordova WWW
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cordova-www
          path: cordova/www

  build-android:
    runs-on: ubuntu-latest
    needs: build-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www
      
      - name: Setup Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Prepare Android
        run: |
          cordova platform add android@latest
          npm install
        working-directory: ./cordova

      - name: Build APK
        run: cordova build android
        working-directory: ./cordova

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: cordova/platforms/android/app/build/outputs/apk/debug/*.apk

  build-electron-linux:
    runs-on: ubuntu-latest
    needs: build-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' 

      - name: Add Repository
        run: sudo add-apt-repository universe && sudo apt update

      - name: Install Linux build tools
        run: sudo apt-get install --no-install-recommends -y libopenjp2-tools rpm libarchive-tools snapd

      - name: Setup Snapcraft
        run: |
          sudo snap install snapcraft --classic
          sudo snap install multipass --beta --classic

      - name: Install Cordova
        run: npm install -g cordova
        working-directory: ./cordova

      - name: Prepare Electron
        run: |
          cordova platform add electron
          npm install
        working-directory: ./cordova

      - name: Build Electron (Linux)
        run: npm run build
        working-directory: ./cordova

      - name: Upload Linux Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: |
            cordova/platforms/electron/build/*.deb
            cordova/platforms/electron/build/*.AppImage
            cordova/platforms/electron/build/*.snap
            cordova/platforms/electron/build/*.rpm
            cordova/platforms/electron/build/*.pacman
            cordova/platforms/electron/build/*.tar.gz

  build-electron-windows:
    runs-on: windows-latest
    needs: build-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova
        working-directory: ./cordova

      - name: Prepare Electron
        run: |
          cordova platform add electron
          npm install
        working-directory: ./cordova

      - name: Build Electron (Windows)
        run: npm run build
        working-directory: ./cordova

      - name: Upload Windows Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          files: |
            cordova/platforms/electron/build/*.exe
            cordova/platforms/electron/build/*.msi
  build-electron-macos:
    runs-on: macos-latest
    needs: build-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova
        working-directory: ./cordova

      - name: Install dependencies
        run: npm install
        working-directory: ./cordova

      - name: Add Electron platform
        run: cordova platform add electron
        working-directory: ./cordova

      - name: Build Electron for macOS
        run: npm run build
        working-directory: ./cordova

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: electron-macos
          path: |
            cordova/platforms/electron/build/*.dmg

  notify-telegram-release:
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron-linux
      - build-electron-windows
      - build-electron-macos
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Kirim pesan ringkasan release dulu
      - name: Send Telegram Release Message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RELEASE }}
          APP_NAME: ${{ github.event.release.name || github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
          CHANGELOG: ${{ github.event.release.body || "No changelog provided." }}
        run: |
          MESSAGE=$(cat <<EOF
🚀 *Release Published*

📦 Application: *$APP_NAME*
🏷 Version: *$VERSION*

📝 Changelog:
$CHANGELOG

🔗 [View Release](${{ github.event.release.html_url }})
EOF
          )

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -F chat_id="$CHAT_ID" \
            -F parse_mode=Markdown \
            --data-urlencode text="$MESSAGE"

      # 1. Download Android APK
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: cordova-apk
          path: artifacts/android

      # 2. Download Electron artifacts
      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-macos
          path: artifacts/electron/macos
      - name: Download Electron Windows
        uses: actions/download-artifact@v4
        with:
          name: electron-windows
          path: artifacts/electron/windows
      - name: Download Electron Linux
        uses: actions/download-artifact@v4
        with:
          name: electron-linux
          path: artifacts/electron/linux

      # 3. Kirim semua file ke Telegram dengan rename
      - name: Send Release Files to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_NAME: ${{ github.event.release.name || github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          rename_file() {
            local file_path="$1"
            local ext="${file_path##*.}"
            local new_name="${APP_NAME}-${VERSION}.${ext}"
            echo "$new_name"
          }

          # Kirim Android APK
          for file in artifacts/android/*; do
            [ -f "$file" ] || continue
            NEW_NAME=$(rename_file "$file")
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"$file";filename="$NEW_NAME" \
              -F caption="Android Release: $NEW_NAME"
          done

          # Kirim Electron files
          for file in artifacts/electron/**/*; do
            [ -f "$file" ] || continue
            NEW_NAME=$(rename_file "$file")
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"$file";filename="$NEW_NAME" \
              -F caption="Electron Release: $NEW_NAME"
          done
