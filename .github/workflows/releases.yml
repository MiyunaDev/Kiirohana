name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:

# =====================================================
# BUILD REACT -> cordova/www
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Clean install
        run: |
          rm -rf node_modules
          npm ci
          npm rebuild @tailwindcss/oxide || true

      - name: Install Root Dependencies
        run: |
          npm install
          npm rebuild

      - name: Build React
        run: npm run build

      - name: Upload WWW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

# =====================================================
# BUILD ANDROID
# =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies
        working-directory: ./cordova
        run: |
          npm install
          npm rebuild

      - name: Add Android platform
        working-directory: ./cordova
        run: cordova platform add android@latest

      - name: Build Android
        working-directory: ./cordova
        run: cordova build android

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            cordova/platforms/android/app/build/outputs/apk/**/*.apk
            cordova/platforms/android/app/build/outputs/bundle/**/*.aab

# =====================================================
# BUILD ELECTRON MATRIX (NO RELEASE UPLOAD HERE)
# =====================================================
  build-electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: build-react

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies
        working-directory: ./cordova
        run: |
          npm install
          npm rebuild

      - name: Add Electron platform
        working-directory: ./cordova
        run: cordova platform add electron

      - name: Build Electron
        working-directory: ./cordova
        run: npm run build

      - name: Upload Electron Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: cordova/platforms/electron/build

# =====================================================
# SINGLE RELEASE UPLOADER (FIX ALL RACE CONDITIONS)
# =====================================================
  release-all:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Clean Electron noise files
        run: |
          echo "Cleaning unsafe Electron internal assets..."

          find artifacts -type f \
            \( -name "locale.pak" \
            -o -name "Electron Framework" \
            -o -name "*.dylib" \
            -o -name "*.so" \
            -o -name "*.dll" \
            -o -name "*.pak" \) \
            -delete || true

      - name: Stabilization delay
        run: sleep 8

      - name: Upload ALL to GitHub Release (single atomic step)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

# =====================================================
# TELEGRAM NOTIFICATION (NOW SAFE AFTER RELEASE)
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: DEV
    needs: release-all
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Notes
        id: notes
        run: |
          NOTES=$(git log -5 --pretty=format:"- %s")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Summary
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="🚀 RELEASE COMPLETE

          Repo: ${{ github.repository }}
          Status: ${{ job.status }}

          📜 Notes:
          ${{ steps.notes.outputs.notes }}

          🔗 Run: $RUN_URL"

          curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode text="$TEXT"