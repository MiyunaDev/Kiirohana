name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:

  # =====================================================
  # BUILD REACT -> cordova/www
  # =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      
      - name: Clean install
        run: |
          rm -rf node_modules
          npm ci
          npm rebuild @tailwindcss/oxide || true

      - name: Install Root Dependencies
        run: |
          npm install
          npm rebuild

      - name: Build React
        run: npm run build

      - name: Upload WWW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cordova-www
          path: cordova/www
          if-no-files-found: error

  # =====================================================
  # BUILD ANDROID RELEASE
  # =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download WWW Artifact
        uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Cordova Dependencies
        working-directory: ./cordova
        run: |
          npm install
          npm rebuild

      - name: Add Android Platform
        working-directory: ./cordova
        run: cordova platform add android@latest

      - name: Build Debug APK
        working-directory: ./cordova
        run: cordova build android

      - name: Build Signed Release AAB
        working-directory: ./cordova
        run: |
          cordova build android --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            cordova/platforms/android/app/build/outputs/apk/debug/*.apk
            cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Android To GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cordova/platforms/android/app/build/outputs/apk/debug/*.apk
            cordova/platforms/android/app/build/outputs/bundle/release/*.aab

  # =====================================================
  # BUILD ELECTRON RELEASE MATRIX
  # =====================================================
  build-electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: build-react

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download WWW Artifact
        uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux Build Tools
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Cordova Dependencies
        working-directory: ./cordova
        run: |
          npm install
          npm rebuild

      - name: Add Electron Platform
        working-directory: ./cordova
        run: cordova platform add electron

      - name: Build Electron
        working-directory: ./cordova
        run: npm run build

      - name: Upload Electron Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: cordova/platforms/electron/build/**
          if-no-files-found: warn

      - name: Upload Electron To GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cordova/platforms/electron/build/**

  # =====================================================
  # TELEGRAM RELEASE NOTIFICATION
  # =====================================================
  notify-telegram:
    name: Notify Telegram Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # =====================================================
      # SEND RELEASE SUMMARY
      # =====================================================
      - name: Send Release Summary
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_RELEASE }}"

          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "Missing Telegram config"
            exit 1
          fi

          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          SHA="${GITHUB_SHA::7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="🚀 *RELEASE BUILD FINISHED*

          📦 Repo: $REPO
          🌿 Branch: $BRANCH
          🔖 Commit: $SHA
          📊 Status: $STATUS

          🔗 [GitHub Run]($RUN_URL)"

          if [ -n "$THREAD" ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              -d parse_mode="Markdown" \
              --data-urlencode text="$TEXT"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d parse_mode="Markdown" \
              --data-urlencode text="$TEXT"
          fi

      # =====================================================
      # SEND RELEASE FILES (GROUPED)
      # =====================================================
      - name: Send Release Artifacts
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_RELEASE }}"

          send_file () {
            local file=$1
            local caption=$2

            if [ -n "$THREAD" ]; then
              curl -s --fail-with-body \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="$caption"
            else
              curl -s --fail-with-body \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="$caption"
            fi
          }

          echo "📦 Collecting release artifacts..."

          APK_FILES=$(find artifacts -type f -name "*.apk")
          AAB_FILES=$(find artifacts -type f -name "*.aab")
          ELECTRON_FILES=$(find artifacts -type f -not -name "*.apk" -not -name "*.aab")

          # =========================
          # ANDROID APK
          # =========================
          if [ ! -z "$APK_FILES" ]; then
            echo "Sending APK..."
            for file in $APK_FILES; do
              SIZE=$(du -h "$file" | cut -f1)
              send_file "$file" "📱 Android APK ($SIZE)"
              sleep 1
            done
          fi

          # =========================
          # ANDROID AAB
          # =========================
          if [ ! -z "$AAB_FILES" ]; then
            echo "Sending AAB..."
            for file in $AAB_FILES; do
              SIZE=$(du -h "$file" | cut -f1)
              send_file "$file" "📦 Android AAB ($SIZE)"
              sleep 1
            done
          fi

          # =========================
          # ELECTRON
          # =========================
          if [ ! -z "$ELECTRON_FILES" ]; then
            echo "Sending Electron builds..."
            for file in $ELECTRON_FILES; do
              SIZE=$(du -h "$file" | cut -f1)
              NAME=$(basename "$file")
              send_file "$file" "🖥 Electron: $NAME ($SIZE)"
              sleep 1
            done
          fi

          echo "✅ Release artifacts sent"