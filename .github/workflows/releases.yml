name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  APP_NAME: "Kiirohana"

jobs:

# =====================================================
# BUILD REACT (INTERNAL ONLY)
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Validate
        run: test -d cordova/www

      # jangan publish cordova-www ke release
      - name: Pack WWW
        run: |
          cd cordova
          zip -qr ../cordova-www.zip www

      - uses: actions/upload-artifact@v4
        with:
          name: _internal-www
          path: cordova-www.zip
          retention-days: 1

# =====================================================
# BUILD ANDROID RELEASE
# =====================================================
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: _internal-www

      - name: Restore WWW
        run: |
          unzip -q cordova-www.zip
          rm -rf cordova/www
          mkdir -p cordova
          mv www cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - run: npm i -g cordova

      - working-directory: cordova
        run: npm ci || npm install

      - name: Version
        id: ver
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Reset Android
        working-directory: cordova
        run: |
          cordova platform rm android || true
          cordova platform add android@latest

      # release oriented
      - name: Build APK + AAB
        working-directory: cordova
        run: |
          cordova build android --release
          cordova build android

      - name: Prepare Release Files
        shell: bash
        run: |
          mkdir -p release-files

          APK=$(find cordova -type f -name "*.apk" | head -n1)
          AAB=$(find cordova -type f -name "*.aab" | head -n1)

          cp "$APK" "release-files/${APP_NAME} ${{ steps.ver.outputs.version }}.apk"
          cp "$AAB" "release-files/${APP_NAME} ${{ steps.ver.outputs.version }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-files/*

# =====================================================
# BUILD ELECTRON RELEASE
# =====================================================
  build-electron:
    name: Electron ${{ matrix.os }}-${{ matrix.arch }}
    needs: build-react
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64
          - os: windows
            runner: windows-latest
            arch: ia32
          - os: windows
            runner: windows-latest
            arch: arm64
          - os: linux
            runner: ubuntu-latest
            arch: x64
          - os: linux
            runner: ubuntu-latest
            arch: arm64
          - os: linux
            runner: ubuntu-latest
            arch: armv7l
          - os: macos
            runner: macos-latest
            arch: universal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: _internal-www

      - name: Restore WWW
        shell: bash
        run: |
          unzip -q cordova-www.zip
          rm -rf cordova/www
          mkdir -p cordova
          mv www cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools fakeroot dpkg

      - run: npm i -g cordova

      - working-directory: cordova
        run: npm ci || npm install

      - name: Version
        id: ver
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Reset Electron
        working-directory: cordova
        run: |
          cordova platform rm electron || true
          cordova platform add electron

      # release build
      - name: Build Electron Release
        working-directory: cordova
        shell: bash
        run: |
          cordova build electron --release -- --${{ matrix.arch }}

      - name: Cleanup
        shell: bash
        run: |
          find cordova -iname "elevate.exe" -delete || true
          find cordova -iname "uninstall.exe" -delete || true
          find cordova -iname "*.map" -delete || true
          find cordova -iname ".DS_Store" -delete || true
          find cordova -iname "Thumbs.db" -delete || true

      - name: Prepare Release Files
        shell: bash
        run: |
          mkdir -p release-files

          find cordova -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" -o \
               -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o \
               -name "*.tar.gz" -o -name "*.dmg" -o -name "*.pkg" \) \
            ! -iname "elevate.exe" \
            ! -iname "uninstall.exe" \
          | while read -r f; do

            BASE=$(basename "$f")
            EXT="${BASE##*.}"
            case "$BASE" in
              *.tar.gz) EXT="tar.gz" ;;
            esac

            cp "$f" \
            "release-files/${APP_NAME} (${{
              matrix.os
            }}-${{
              matrix.arch
            }}) ${{ steps.ver.outputs.version }}.${EXT}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}-${{ matrix.arch }}
          path: release-files/*

# =====================================================
# UPLOAD TO GITHUB RELEASE
# =====================================================
  release-all:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Select final assets only
        shell: bash
        run: |
          mkdir -p release-files

          find artifacts -type f | while read -r file; do
            NAME=$(basename "$file")

            case "$NAME" in
              *.apk|*.aab|*.exe|*.msi|*.zip|*.AppImage|*.deb|*.rpm|*.tar.gz|*.dmg|*.pkg)
                case "$NAME" in
                  elevate.exe|uninstall.exe|Uninstall.exe)
                    continue
                    ;;
                esac

                cp -f "$file" "release-files/$NAME"
                ;;
            esac
          done

          test "$(find release-files -type f | wc -l)" -gt 0

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/**

# =====================================================
# TELEGRAM
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: release-all
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Files
        shell: bash
        run: |
          mkdir -p telegram-files

          find artifacts -type f \( \
            -iname "*.apk" -o \
            -iname "*.aab" -o \
            -iname "*.exe" -o \
            -iname "*.msi" -o \
            -iname "*.zip" -o \
            -iname "*.appimage" -o \
            -iname "*.deb" -o \
            -iname "*.rpm" -o \
            -iname "*.tar.gz" -o \
            -iname "*.dmg" -o \
            -iname "*.pkg" \
          \) | while read -r file; do

            NAME=$(basename "$file")

            case "$NAME" in
              elevate.exe|uninstall.exe|Uninstall.exe)
                continue
                ;;
            esac

            echo "COPY: $file"

            cp "$file" telegram-files/
          done

          echo "=== TELEGRAM FILES ==="
          ls -lah telegram-files

      - name: Send Summary
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          URL="${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}"

          TEXT="🚀 ${APP_NAME} Released

          Version: $VERSION
          Repo: ${{ github.repository }}

          🔗 Release:
          $URL"

          if [ -n "$THREAD" ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              --data-urlencode text="$TEXT"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode text="$TEXT"
          fi

      - name: Send Files
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"
          MAX=$((45 * 1024 * 1024))

          find telegram-files -type f | while read -r file; do
            NAME=$(basename "$file")
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")

            [ "$SIZE" -gt "$MAX" ] && continue

            if [ -n "$THREAD" ]; then
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            else
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            fi

            sleep 2
          done