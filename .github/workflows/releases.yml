name: Release Build Cordova

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "23"

jobs:

# =====================================================
# BUILD REACT (TEMP ONLY / NO ARTIFACT UPLOAD)
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate output
        run: |
          test -d cordova/www || (echo "cordova/www missing" && exit 1)

      # ZIP INTERNAL TRANSFER ONLY
      - name: Pack WWW
        run: |
          cd cordova
          zip -qr ../cordova-www.zip www

      - name: Upload Internal WWW
        uses: actions/upload-artifact@v7
        with:
          name: _internal-www
          path: cordova-www.zip
          retention-days: 1

# =====================================================
# BUILD ANDROID
# =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: _internal-www

      - name: Restore WWW
        run: |
          unzip -q cordova-www.zip
          mkdir -p cordova
          rm -rf cordova/www
          mv www cordova/www

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ -z "$VERSION" ]; then
            VERSION="0.0.0"
          fi

          echo "Detected version: $VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Reset Android platform
        working-directory: cordova
        run: |
          cordova platform rm android || true
          cordova platform add android@latest

      - name: Build Debug APK
        working-directory: cordova
        run: cordova build android

      - name: Build Release AAB
        working-directory: cordova
        run: cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

# =====================================================
# BUILD ELECTRON
# =====================================================
  build-electron:
    name: Electron ${{ matrix.os }}-${{ matrix.arch }}
    needs: build-react
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64

          - os: windows
            runner: windows-latest
            arch: ia32

          - os: windows
            runner: windows-latest
            arch: arm64

          - os: linux
            runner: ubuntu-latest
            arch: x64

          - os: linux
            runner: ubuntu-latest
            arch: ia32


          - os: linux
            runner: ubuntu-latest
            arch: arm64

          - os: linux
            runner: ubuntu-latest
            arch: armv7l

          - os: macos
            runner: macos-latest
            arch: universal

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: _internal-www

      - name: Restore WWW
        shell: bash
        run: |
          unzip -q cordova-www.zip
          mkdir -p cordova
          rm -rf cordova/www
          mv www cordova/www

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools fakeroot dpkg

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Reset Electron
        working-directory: cordova
        run: |
          cordova platform rm electron || true
          cordova platform add electron
      
      - name: Build Electron Release
        working-directory: cordova
        shell: bash
        run: |
           npm run build

      - name: Remove helper junk
        shell: bash
        run: |
          find cordova -iname "elevate.exe" -delete || true
          find cordova -iname "uninstall.exe" -delete || true
          find cordova -iname "*.map" -delete || true

      - name: Collect Electron Outputs
        shell: bash
        run: |
          mkdir -p release

          while IFS= read -r file; do
            NAME=$(basename "$file")

            echo "COPY: $NAME"

            cp "$file" "release/$NAME"

          done < <(
            find cordova/platforms/electron/build -type f \( \
              -name "*Setup*.exe" -o \
              -name "*Portable*.exe" -o \
              -name "*.msi" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" -o \
              -name "*.tar.gz" -o \
              -name "*.dmg" -o \
              -name "*.pkg" -o \
              -name "*.zip" \
            \)
          )

          echo "=== RELEASE FILES ==="
          ls -lah release

      - name: Upload Electron
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: warn

# =====================================================
# UPLOAD TO GITHUB RELEASE
# =====================================================
  release-all:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "android-*"
          
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "electron-*"

      - name: Select final assets only
        shell: bash
        run: |
          mkdir -p release-files

          while IFS= read -r file; do
            NAME=$(basename "$file")

            case "$NAME" in
              *.apk|\
              *.aab|\
              *.exe|\
              *.msi|\
              *.zip|\
              *.AppImage|\
              *.deb|\
              *.rpm|\
              *.tar.gz|\
              *.dmg|\
              *.pkg)

                REL=$(echo "$file" | sed 's#artifacts/##g' | tr '/' '_')

                echo "COPY: $REL"

                cp "$file" "release-files/$REL"
                ;;
            esac

          done < <(find artifacts -type f)

          echo "=== RELEASE FILES ==="
          ls -lah release-files

          test "$(find release-files -type f | wc -l)" -gt 0

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*

# =====================================================
# TELEGRAM
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: DEV
    needs: release-all
    if: |
      success() &&
      github.event_name != 'pull_request'

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "android-*"
          
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "electron-*"

      - name: Prepare Files
        shell: bash
        run: |
          mkdir -p telegram-files

          while IFS= read -r file; do
            NAME=$(basename "$file")

            case "$NAME" in
              *.apk|\
              *.aab|\
              *.exe|\
              *.msi|\
              *.zip|\
              *.AppImage|\
              *.deb|\
              *.rpm|\
              *.tar.gz|\
              *.dmg|\
              *.pkg)

                REL=$(echo "$file" | sed 's#artifacts/##g' | tr '/' '_')

                echo "COPY: $REL"

                cp "$file" "telegram-files/$REL"
                ;;
            esac

          done < <(find artifacts -type f)

          echo "=== TELEGRAM FILES ==="
          ls -lah telegram-files

      - name: Send Summary
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_RELEASE }}"

          VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          URL="${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}"

          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          SHA="${GITHUB_SHA::7}"

          APK_COUNT=$(find artifacts -type f -iname "*.apk" | wc -l)
          AAB_COUNT=$(find artifacts -type f -iname "*.aab" | wc -l)

          EXE_COUNT=$(find artifacts -type f -iname "*.exe" | wc -l)
          MSI_COUNT=$(find artifacts -type f -iname "*.msi" | wc -l)

          APPIMAGE_COUNT=$(find artifacts -type f -iname "*.AppImage" | wc -l)
          DEB_COUNT=$(find artifacts -type f -iname "*.deb" | wc -l)
          RPM_COUNT=$(find artifacts -type f -iname "*.rpm" | wc -l)

          DMG_COUNT=$(find artifacts -type f -iname "*.dmg" | wc -l)
          PKG_COUNT=$(find artifacts -type f -iname "*.pkg" | wc -l)

          TOTAL=$(find artifacts -type f | wc -l)

          TEXT="🚀 <b>${REPO}</b> New Release Published

          🏷 <b>Version:</b> ${VERSION}
          👤 <b>Owner:</b> ${OWNER}
          🔖 <b>Commit:</b> ${SHA}

          📦 <b>Build Artifacts</b>
          • Android APK: ${APK_COUNT}
          • Android AAB: ${AAB_COUNT}

          • Windows EXE: ${EXE_COUNT}
          • Windows MSI: ${MSI_COUNT}

          • Linux AppImage: ${APPIMAGE_COUNT}
          • Linux DEB: ${DEB_COUNT}
          • Linux RPM: ${RPM_COUNT}

          • macOS DMG: ${DMG_COUNT}
          • macOS PKG: ${PKG_COUNT}

          📁 <b>Total Files:</b> ${TOTAL}

          🔗 <b>GitHub Release</b>
          ${URL}"

          if [ -n "$THREAD" ]; then
            RESP=$(curl --fail --retry 5 --retry-delay 3 \
              -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              -d parse_mode="HTML" \
              --data-urlencode text="$TEXT")
          else
            RESP=$(curl --fail --retry 5 --retry-delay 3 \
              -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d parse_mode="HTML" \
              --data-urlencode text="$TEXT")
          fi

          echo "$RESP"

          echo "$RESP" | grep '"ok":true' >/dev/null || exit 1

      - name: Send Files
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          MAX=$((45 * 1024 * 1024))

          while IFS= read -r file; do
            NAME=$(basename "$file")
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")

            if [ "$SIZE" -gt "$MAX" ]; then
              echo "SKIP TOO LARGE: $NAME"
              continue
            fi

            echo "UPLOAD: $NAME"

            if [ -n "$THREAD" ]; then
              RESP=$(curl --fail --retry 5 --retry-delay 3 \
                -s -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="📦 $NAME")
            else
              RESP=$(curl --fail --retry 5 --retry-delay 3 \
                -s -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $NAME")
            fi

            echo "$RESP"

            echo "$RESP" | grep '"ok":true' >/dev/null || exit 1

            sleep 2

          done < <(find telegram-files -type f)