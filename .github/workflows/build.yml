name: Build Cordova Android & Electron

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:

# =====================================================
# BUILD REACT -> cordova/www
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate output
        run: |
          test -d cordova/www || (echo "cordova/www missing" && exit 1)

      - name: Upload WWW
        uses: actions/upload-artifact@v4
        with:
          name: cordova-www
          path: cordova/www
          if-no-files-found: error

# =====================================================
# BUILD ANDROID
# =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install Cordova deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Reset Android platform
        working-directory: cordova
        run: |
          cordova platform rm android || true
          cordova platform add android@latest

      - name: Build APK
        working-directory: cordova
        run: cordova build android

      - name: Build AAB
        working-directory: cordova
        run: cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab

# =====================================================
# BUILD ELECTRON MULTI OS + MULTI ARCH
# =====================================================
  build-electron:
    name: Electron ${{ matrix.os }}-${{ matrix.arch }}
    needs: build-react
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # ---------------- Windows ----------------
          - os: windows
            runner: windows-latest
            arch: x64

          - os: windows
            runner: windows-latest
            arch: ia32

          - os: windows
            runner: windows-latest
            arch: arm64

          # ---------------- Linux ----------------
          - os: linux
            runner: ubuntu-latest
            arch: x64

          - os: linux
            runner: ubuntu-latest
            arch: arm64

          - os: linux
            runner: ubuntu-latest
            arch: armv7l

          # ---------------- macOS ----------------
          - os: macos
            runner: macos-latest
            arch: universal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux package deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools fakeroot dpkg

      - name: Install Cordova
        run: npm i -g cordova

      - name: Install Cordova deps
        working-directory: cordova
        run: npm ci || npm install

      - name: Reset Electron platform
        working-directory: cordova
        run: |
          cordova platform rm electron || true
          cordova platform add electron

      - name: Build Electron
        working-directory: cordova
        shell: bash
        run: |
          cordova build electron -- --${{ matrix.arch }}

      # SAFE CLEANUP ONLY
      - name: Remove junk only
        shell: bash
        run: |
          find cordova -name "*.map" -type f -delete || true
          find cordova -name ".DS_Store" -type f -delete || true
          find cordova -name "Thumbs.db" -type f -delete || true
          find cordova -name "*.tsbuildinfo" -type f -delete || true

      - name: Upload Electron Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            cordova/**/*.exe
            cordova/**/*.msi
            cordova/**/*.zip
            cordova/**/*.AppImage
            cordova/**/*.deb
            cordova/**/*.rpm
            cordova/**/*.tar.gz
            cordova/**/*.dmg
            cordova/**/*.pkg
          if-no-files-found: warn

# =====================================================
# TELEGRAM NOTIFICATION
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: DEV
    needs:
      - build-android
      - build-electron
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: |
            android-*
            electron-*
          path: artifacts
          merge-multiple: true

      # =====================================================
      # FILTER ONLY INSTALLER / PORTABLE FILES
      # =====================================================
      - name: Select valid files only
        shell: bash
        run: |
          mkdir -p telegram-files

          find artifacts -type f | while read file; do
            NAME=$(basename "$file")

            case "$NAME" in
              # Android
              *.apk|*.aab|

              # Windows
              *.exe|*.msi|*.zip|

              # Linux
              *.AppImage|*.deb|*.rpm|*.tar.gz|

              # macOS
              *.dmg|*.pkg)

                # block helper / uninstall / junk
                case "$NAME" in
                  elevate.exe|uninstall.exe|Uninstall.exe)
                    echo "Skip helper: $NAME"
                    continue
                    ;;
                esac

                cp "$file" telegram-files/
                echo "Accepted: $NAME"
                ;;

              *)
                echo "Rejected: $NAME"
                ;;
            esac
          done

          echo "Selected files:"
          ls -lah telegram-files || true

      # =====================================================
      # SUMMARY MESSAGE
      # =====================================================
      - name: Send Summary
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="🚀 Build Finished

          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${GITHUB_SHA::7}

          Run:
          $URL"

          if [ -n "$THREAD" ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              --data-urlencode text="$TEXT"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode text="$TEXT"
          fi

      # =====================================================
      # SEND SAFE FILES ONLY
      # =====================================================
      - name: Send Files
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"
          MAX=$((45 * 1024 * 1024))

          COUNT=0

          while IFS= read -r file; do
            NAME=$(basename "$file")

            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")

            if [ "$SIZE" -gt "$MAX" ]; then
              echo "Skip large file: $NAME"
              continue
            fi

            echo "Sending $NAME"

            if [ -n "$THREAD" ]; then
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            else
              curl -s --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $NAME"
            fi

            COUNT=$((COUNT + 1))
            sleep 2

          done < <(find telegram-files -type f)

          echo "Sent $COUNT files"