name: Build Cordova Android & Electron

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"
  JAVA_VERSION: "21"

jobs:

  # =====================================================
  # BUILD REACT -> cordova/www
  # =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm ci

      - name: Install Root Dependencies
        run: |
          npm install
          npm rebuild

      - name: Build React App
        run: npm run build

      - name: Upload WWW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cordova-www
          path: cordova/www
          if-no-files-found: error

  # =====================================================
  # BUILD ANDROID
  # =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download WWW Artifact
        uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Cordova Dependencies
        working-directory: ./cordova
        run: |
          npm install
          npm rebuild

      - name: Add Android Platform
        working-directory: ./cordova
        run: cordova platform add android@latest

      - name: Build Debug APK
        working-directory: ./cordova
        run: cordova build android

      - name: Build Signed Release AAB
        working-directory: ./cordova
        run: |
          cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # =====================================================
  # BUILD ELECTRON MATRIX
  # =====================================================
  build-electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: build-react

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download WWW Artifact
        uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux Build Tools
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Cordova Dependencies
        working-directory: ./cordova
        run: |
          npm install
          npm rebuild

      - name: Add Electron Platform
        working-directory: ./cordova
        run: cordova platform add electron

      - name: Build Electron
        working-directory: ./cordova
        run: npm run build

      - name: Upload Electron Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: cordova/platforms/electron/build/**
          if-no-files-found: warn

  # =====================================================
  # TELEGRAM NOTIFICATION
  # =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-electron
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Send Summary Message
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          STATUS="${{ job.status }}"
          URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="🚀 Build Finished\n\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${GITHUB_SHA::7}\nStatus: $STATUS\nRun: $URL"

          curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode text="$TEXT"

      - name: Send Artifact Files
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"

          shopt -s globstar nullglob
          COUNT=0

          for file in artifacts/**/*; do
            if [[ -f "$file" ]]; then
              NAME=$(basename "$file")
              SIZE=$(du -h "$file" | cut -f1)

              echo "Sending $NAME ($SIZE)"

              curl -s --retry 3 --retry-delay 5 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $NAME ($SIZE)"

              COUNT=$((COUNT + 1))
              sleep 2
            fi
          done

          echo "Sent $COUNT files"