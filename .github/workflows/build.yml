name: Build Cordova Android & Electron

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:

# =====================================================
# BUILD REACT -> cordova/www
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Clean install (deterministic)
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm ci || npm install
          npm rebuild @tailwindcss/oxide || true

      - name: Build React App
        run: npm run build

      - name: Validate WWW output
        run: |
          if [ ! -d "cordova/www" ]; then
            echo "cordova/www missing"
            exit 1
          fi

      - name: Upload WWW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cordova-www
          path: cordova/www
          if-no-files-found: error

# =====================================================
# BUILD ANDROID
# =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies (stable)
        working-directory: ./cordova
        run: |
          npm ci || npm install
          npm rebuild

      - name: Add Android platform (safe mode)
        working-directory: ./cordova
        run: |
          cordova platform rm android || true
          cordova platform add android@latest

      - name: Build Debug APK
        working-directory: ./cordova
        run: cordova build android

      - name: Build Release AAB
        working-directory: ./cordova
        run: cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab

# =====================================================
# BUILD ELECTRON MATRIX (CLEAN + NO SIDE EFFECTS)
# =====================================================
  build-electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: build-react

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cordova-www
          path: cordova/www

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies (safe)
        working-directory: ./cordova
        run: |
          npm ci || npm install
          npm rebuild

      - name: Reset Electron platform (avoid corruption)
        working-directory: ./cordova
        run: |
          cordova platform rm electron || true
          cordova platform add electron

      - name: Build Electron
        working-directory: ./cordova
        run: npm run build

      # =====================================================
      # CLEAN ELECTRON NOISE (CRITICAL FIX)
      # =====================================================
      - name: Remove Electron internal noise (cross-platform safe)
        shell: bash
        run: |
          TARGET="cordova/platforms/electron/build"

          echo "Cleaning Electron noise safely..."

          # safer than find with parentheses (works cross-platform via bash layer)
          if [ -d "$TARGET" ]; then
            for f in $(find "$TARGET" -type f); do

              case "$f" in
                *locale.pak) rm -f "$f" ;;
                *"Electron Framework") rm -f "$f" ;;
                *.pak) rm -f "$f" ;;
                *.dll) rm -f "$f" ;;
                *.so) rm -f "$f" ;;
                *.dylib) rm -f "$f" ;;
              esac

            done
          fi

      - name: Upload Electron Artifact (clean)
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: cordova/platforms/electron/build

# =====================================================
# TELEGRAM NOTIFICATION (HARDENED)
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: DEV
    needs:
      - build-android
      - build-electron
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # =====================================================
      # SUMMARY MESSAGE (SAFE + FIXED FORMAT)
      # =====================================================
      - name: Send Summary Message
        shell: bash
        run: |
          set -e

          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          STATUS="${{ job.status }}"
          URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          TEXT=$(cat <<EOF
          🚀 Build Finished

          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: $SHORT_SHA
          Status: $STATUS

          Run: $URL
          EOF
          )

          if [ -n "$THREAD" ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              --data-urlencode text="$TEXT"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode text="$TEXT"
          fi

      # =====================================================
      # FILE SENDER (SAFE FILTERED + RATE LIMITED)
      # =====================================================
      - name: Send Artifact Files
        shell: bash
        run: |
          set -e

          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          MAX_SIZE=$((45 * 1024 * 1024))

          ALLOWED_EXT=("apk" "aab" "exe" "AppImage" "deb" "rpm" "zip" "dmg")

          send_file() {
            local file="$1"
            local name=$(basename "$file")

            SIZE=$(stat -c%s "$file")

            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "Skip large file: $name"
              return
            fi

            echo "Sending $name"

            if [ -n "$THREAD" ]; then
              curl -s --fail-with-body --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="📦 $name"
            else
              curl -s --fail-with-body --retry 3 \
                -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $name"
            fi

            sleep $((RANDOM % 3 + 2))
          }

          COUNT=0

          while IFS= read -r file; do
            EXT="${file##*.}"

            SKIP=1
            for a in "${ALLOWED_EXT[@]}"; do
              if [ "$EXT" = "$a" ]; then
                SKIP=0
                break
              fi
            done

            if [ "$SKIP" -eq 1 ]; then
              continue
            fi

            send_file "$file"
            COUNT=$((COUNT + 1))

          done < <(find artifacts -type f)

          echo "Sent $COUNT files"