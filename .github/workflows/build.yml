name: Build Cordova Android & Electron

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - name: Install dependencies (Root / React)
        run: npm install

      - name: Build React → cordova/www
        run: npm run build

      - name: Upload Cordova WWW
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cordova-www
          path: cordova/www

  build-android:
    runs-on: ubuntu-latest
    needs: build-react
    env:
      BUILD_ENV: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Android
        run: |
          cordova platform add android@latest
          npm install
        working-directory: ./cordova

      # ===================================================
      # CREATE .p12 FILE FROM GITHUB SECRET
      # ===================================================
      - name: Decode Android Signing Key (.p12)
        run: |
          echo "${{ secrets.ANDROID_P12_BASE64 }}" | base64 -d > android-key.p12
        working-directory: ./cordova

      - name: Build APK (Debug)
        run: cordova build android \
            -- \
            --packageType=bundle \
            --keystore=android-key.p12 \
            --storeType=pkcs12 \
            --storePassword=${{ secrets.ANDROID_STORE_PASSWORD }} \
            --alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            --password=${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ./cordova

      - name: Build AAB (Release Signed)
        run: |
          cordova build android --release \
            -- \
            --packageType=bundle \
            --keystore=android-key.p12 \
            --storeType=pkcs12 \
            --storePassword=${{ secrets.ANDROID_STORE_PASSWORD }} \
            --alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            --password=${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ./cordova

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-apk
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-aab
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab

    runs-on: ubuntu-latest
    needs: build-react
    env:
      BUILD_ENV: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www
      
      - name: Setup Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Prepare Android
        run: |
          cordova platform add android@latest
          npm install
        working-directory: ./cordova

      - name: Build APK (Debug)
        run: cordova build android
        working-directory: ./cordova

      - name: Build AAB (Release)
        run: cordova build android --release
        working-directory: ./cordova

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-apk
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-aab
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab

  build-electron-linux:
    runs-on: ubuntu-latest
    needs: build-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' 

      - name: Add Repository
        run: sudo add-apt-repository universe && sudo apt update

      - name: Install Linux build tools
        run: sudo apt-get install --no-install-recommends -y libopenjp2-tools rpm libarchive-tools snapd

      - name: Setup Snapcraft
        run: |
          sudo snap install snapcraft --classic
          sudo snap install multipass --beta --classic

      - name: Install Cordova
        run: npm install -g cordova
        working-directory: ./cordova

      - name: Prepare Electron
        run: |
          cordova platform add electron
          npm install
        working-directory: ./cordova

      - name: Build Electron (Linux)
        run: npm run build
        working-directory: ./cordova

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: electron-linux
          path: |
            cordova/platforms/electron/build/*.deb
            cordova/platforms/electron/build/*.AppImage
            cordova/platforms/electron/build/*.snap
            cordova/platforms/electron/build/*.rpm
            cordova/platforms/electron/build/*.pacman
            cordova/platforms/electron/build/*.tar.gz

  build-electron-windows:
    runs-on: windows-latest
    needs: build-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova
        working-directory: ./cordova

      - name: Prepare Electron
        run: |
          cordova platform add electron
          npm install
        working-directory: ./cordova

      - name: Build Electron (Windows)
        run: npm run build
        working-directory: ./cordova

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: electron-windows
          path: |
            cordova/platforms/electron/build/*.exe
            cordova/platforms/electron/build/*.msi
            cordova/platforms/electron/build/*.tar.gz

  build-electron-macos:
    runs-on: macos-latest
    needs: build-react
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Download Cordova WWW
        uses: actions/download-artifact@v4.1.8
        with:
          name: cordova-www
          path: cordova/www

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova
        working-directory: ./cordova

      - name: Install dependencies
        run: npm install
        working-directory: ./cordova

      - name: Add Electron platform
        run: cordova platform add electron
        working-directory: ./cordova

      - name: Build Electron for macOS
        run: npm run build
        working-directory: ./cordova

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: electron-macos
          path: |
            cordova/platforms/electron/build/*.dmg
            cordova/platforms/electron/build/*.app
            cordova/platforms/electron/build/*.pkg
            cordova/platforms/electron/build/*.tar.gz
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest

    needs:
      - build-android
      - build-electron-linux
      - build-electron-windows
      - build-electron-macos

    # tetap jalan walau ada job gagal
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: artifacts
          merge-multiple: false

      - name: Determine Telegram Target
        id: chat
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "chat_id=${{ secrets.TELEGRAM_CHAT_ID_RELEASE }}" >> "$GITHUB_OUTPUT"
            echo "mode=RELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" >> "$GITHUB_OUTPUT"
            echo "mode=DEV" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Summary
        id: meta
        shell: bash
        run: |
          echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      # ===============================================
      # KIRIM PESAN RINGKASAN DULU
      # ===============================================
      - name: Send summary message
        shell: bash
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ steps.chat.outputs.chat_id }}"
          MODE="${{ steps.chat.outputs.mode }}"

          TEXT="🚀 Build Finished (%0A\
  Mode: $MODE%0A\
  Repo: ${{ steps.meta.outputs.repo }}%0A\
  Branch: ${{ steps.meta.outputs.branch }}%0A\
  Commit: ${{ steps.meta.outputs.sha }}%0A\
  Run: ${{ steps.meta.outputs.run_url }})"

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="HTML" \
            -d text="$TEXT"

      # ===============================================
      # KIRIM FILE ARTIFACT
      # ===============================================
      - name: Send files to Telegram
        shell: bash
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ steps.chat.outputs.chat_id }}"
          MODE="${{ steps.chat.outputs.mode }}"

          shopt -s globstar nullglob

          COUNT=0

          for file in artifacts/**/*; do
            if [[ -f "$file" ]]; then
              NAME=$(basename "$file")
              SIZE=$(du -h "$file" | cut -f1)

              echo "Sending $NAME ($SIZE)"

              curl -s --retry 3 --retry-delay 5 \
                -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
                -F chat_id="$CHAT_ID" \
                -F document=@"$file" \
                -F caption="📦 [$MODE] $NAME ($SIZE)"

              COUNT=$((COUNT+1))
              sleep 2
            fi
          done

          echo "Sent $COUNT files"

      # ===============================================
      # JIKA TIDAK ADA FILE
      # ===============================================
      - name: Notify if no artifact found
        if: failure()
        shell: bash
        run: |
          echo "Artifact sending step failed"