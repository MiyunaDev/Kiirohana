name: Build Cordova, Electron & Web Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"
  JAVA_VERSION: "17" # Wajib 17 agar Gradle Android di Cordova tidak crash

jobs:

# =====================================================
# BUILD REACT (BASE WWW)
# =====================================================
  build-react:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Validate output
        run: |
          test -d cordova/www || (echo "cordova/www missing" && exit 1)

      - name: Pack WWW
        run: |
          cd cordova
          zip -qr ../cordova-www.zip www

      - name: Upload Internal WWW
        uses: actions/upload-artifact@v4
        with:
          name: _internal-www
          path: cordova-www.zip
          retention-days: 1

# =====================================================
# BUILD WEB (DOCKER IMAGE & PUSH TO REGISTRY)
# =====================================================
  build-web:
    name: Build Web Docker & Push
    runs-on: ubuntu-latest
    needs: build-react

    # [!WARNING] Make sure if you clone or make fork for this repo and want to keep GH Actions Workflow. Change this
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      IMAGE_NAME: kiirohana-web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: _internal-www

      - name: Restore WWW
        run: |
          unzip -q cordova-www.zip
          mkdir -p cordova
          rm -rf cordova/www
          mv www cordova/www

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = true
              insecure = true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# =====================================================
# BUILD ANDROID
# =====================================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: build-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: _internal-www

      - name: Restore WWW
        run: |
          unzip -q cordova-www.zip
          mkdir -p cordova
          rm -rf cordova/www
          mv www cordova/www

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: pnpm install -g cordova

      - name: Install deps
        working-directory: cordova
        run: pnpm install

      - name: Reset Android platform
        working-directory: cordova
        run: |
          cordova platform rm android || true
          cordova platform add android@latest

      - name: Build Debug APK
        working-directory: cordova
        run: cordova build android

      - name: Build Release AAB
        working-directory: cordova
        run: cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: cordova/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

# =====================================================
# BUILD ELECTRON
# =====================================================
  build-electron:
    name: Electron ${{ matrix.os }}
    needs: build-react
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: _internal-www

      - name: Restore WWW
        shell: bash
        run: |
          unzip -q cordova-www.zip
          mkdir -p cordova
          rm -rf cordova/www
          mv www cordova/www

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y rpm libarchive-tools fakeroot dpkg

      - name: Install Cordova
        run: pnpm install -g cordova

      - name: Install deps
        working-directory: cordova
        run: pnpm install

      - name: Reset Electron
        working-directory: cordova
        run: |
          cordova platform rm electron || true
          cordova platform add electron
      
      - name: Build Electron Release
        working-directory: cordova
        shell: bash
        run: pnpm run build

      - name: Collect Electron Outputs
        shell: bash
        run: |
          mkdir -p release
          while IFS= read -r file; do
            NAME=$(basename "$file")
            cp "$file" "release/$NAME"
          done < <(
            find cordova/platforms/electron/build -type f \( \
              -name "*Setup*.exe" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" -o \
              -name "*.zip" \
            \)
          )

      - name: Upload Electron
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: release/*
          if-no-files-found: warn

# =====================================================
# TELEGRAM
# =====================================================
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: DEV
    needs:
      - build-android
      - build-electron
    if: |
      success() &&
      github.event_name != 'pull_request'

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "android-*"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "electron-*"

      - name: Send Summary
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          mkdir -p summary

          SUMMARY_FILE="summary/message.txt"

          echo "🚀 BUILD SUCCESS" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "📦 Repository" >> "$SUMMARY_FILE"
          echo "${{ github.repository }}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "🌿 Branch" >> "$SUMMARY_FILE"
          echo "${{ github.ref_name }}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "🔖 Commit" >> "$SUMMARY_FILE"
          echo "${GITHUB_SHA::7}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "🖥 Runner" >> "$SUMMARY_FILE"
          echo "${{ runner.os }}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "🔗 Workflow Run" >> "$SUMMARY_FILE"
          echo "$URL" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "==============================" >> "$SUMMARY_FILE"
          echo "📁 GENERATED FILES" >> "$SUMMARY_FILE"
          echo "==============================" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          COUNT=0

          while IFS= read -r file; do
            NAME=$(basename "$file")

            SIZE=$(du -h "$file" | cut -f1)

            REL=$(echo "$file" | sed 's#artifacts/##g')

            echo "• $REL" >> "$SUMMARY_FILE"
            echo "  Size: $SIZE" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"

            COUNT=$((COUNT + 1))

          done < <(find artifacts -type f | sort)

          echo "==============================" >> "$SUMMARY_FILE"
          echo "📊 TOTAL FILES: $COUNT" >> "$SUMMARY_FILE"
          echo "==============================" >> "$SUMMARY_FILE"

          echo "===== TELEGRAM SUMMARY ====="
          cat "$SUMMARY_FILE"

          if [ -n "$THREAD" ]; then
            curl --fail -s -X POST \
              "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$THREAD" \
              --data-urlencode text@"$SUMMARY_FILE"
          else
            curl --fail -s -X POST \
              "https://api.telegram.org/bot$BOT/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode text@"$SUMMARY_FILE"
          fi

      - name: Prepare Files
        shell: bash
        run: |
          mkdir -p telegram-files

          while IFS= read -r file; do
            NAME=$(basename "$file")

            case "$NAME" in
              *.apk|\
              *.aab|\
              *.exe|\
              *.msi|\
              *.AppImage|\
              *.deb|\
              *.rpm|\
              *.tar.gz|\
              *.dmg|\
              *.pkg|\
              *.zip)

                REL=$(echo "$file" | sed 's#artifacts/##g' | tr '/' '_')

                echo "COPY: $REL"

                cp "$file" "telegram-files/$REL"
                ;;
            esac

          done < <(find artifacts -type f)

          echo "=== TELEGRAM FILES ==="
          ls -lah telegram-files

      - name: Send Files
        shell: bash
        run: |
          BOT="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT="${{ secrets.TELEGRAM_BOT_CHANNEL }}"
          THREAD="${{ secrets.TELEGRAM_BOT_THREAD_BETA }}"

          MAX=$((45 * 1024 * 1024))

          while IFS= read -r file; do
            NAME=$(basename "$file")
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")

            if [ "$SIZE" -gt "$MAX" ]; then
              echo "SKIP TOO LARGE: $NAME"
              continue
            fi

            echo "UPLOAD: $NAME"

            if [ -n "$THREAD" ]; then
              RESP=$(curl --fail --retry 5 --retry-delay 3 \
                -s -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F message_thread_id="$THREAD" \
                -F document=@"$file" \
                -F caption="📦 $NAME")
            else
              RESP=$(curl --fail --retry 5 --retry-delay 3 \
                -s -X POST "https://api.telegram.org/bot$BOT/sendDocument" \
                -F chat_id="$CHAT" \
                -F document=@"$file" \
                -F caption="📦 $NAME")
            fi

            echo "$RESP"

            echo "$RESP" | grep '"ok":true' >/dev/null || exit 1

            sleep 2

          done < <(find telegram-files -type f)