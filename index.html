<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiirohana</title>

    <!-- Content-Security-Policy yang lebih aman dan dalam satu baris -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' https:; object-src 'none'; base-uri 'self';"
    />

    <!-- Cordova (hanya diperlukan jika berjalan di perangkat) -->
    <script src="cordova.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!-- ABAIKAN, INI CUMA REMINDER: 
NOTE :
1. Evaluasi kebutuhan unsafe-inline / unsafe-eval untuk production
2. Tambahkan frame-src untuk mendukung iframe player
3. Tambahkan exception connect-src untuk dev API
4. Pertimbangkan form-action dan upgrade-insecure-requests -->
